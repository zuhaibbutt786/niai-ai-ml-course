<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="860" height="200" fill="#f8fafc"/>
  <text x="430" y="24" text-anchor="middle" fill="#0f172a" font-size="15" font-weight="700">CNN — Convolutional Neural Network Flow</text>

  <rect x="15" y="50" width="90" height="90" rx="8" fill="#4f46e5"/>
  <text x="60" y="90" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Input</text>
  <text x="60" y="110" text-anchor="middle" fill="#c7d2fe" font-size="11">Image</text>

  <path d="M110 95 L140 95" stroke="#4f46e5" stroke-width="2"/>
  <rect x="145" y="50" width="100" height="90" rx="8" fill="#6366f1"/>
  <text x="195" y="85" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Conv</text>
  <text x="195" y="105" text-anchor="middle" fill="#c7d2fe" font-size="11">+ ReLU</text>
  <text x="195" y="122" text-anchor="middle" fill="#c7d2fe" font-size="10">filters</text>

  <path d="M250 95 L280 95" stroke="#4f46e5" stroke-width="2"/>
  <rect x="285" y="55" width="90" height="80" rx="8" fill="#7c3aed"/>
  <text x="330" y="90" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Pool</text>
  <text x="330" y="110" text-anchor="middle" fill="#ede9fe" font-size="11">downsample</text>

  <path d="M380 95 L410 95" stroke="#4f46e5" stroke-width="2"/>
  <rect x="415" y="50" width="100" height="90" rx="8" fill="#8b5cf6"/>
  <text x="465" y="85" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Conv</text>
  <text x="465" y="105" text-anchor="middle" fill="#ede9fe" font-size="11">+ ReLU</text>
  <text x="465" y="122" text-anchor="middle" fill="#ede9fe" font-size="10">deeper</text>

  <path d="M520 95 L550 95" stroke="#4f46e5" stroke-width="2"/>
  <rect x="555" y="55" width="90" height="80" rx="8" fill="#a855f7"/>
  <text x="600" y="90" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Pool</text>
  <text x="600" y="110" text-anchor="middle" fill="#f3e8ff" font-size="11">downsample</text>

  <path d="M650 95 L680 95" stroke="#4f46e5" stroke-width="2"/>
  <rect x="685" y="50" width="90" height="90" rx="8" fill="#c026d3"/>
  <text x="730" y="85" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Dense</text>
  <text x="730" y="105" text-anchor="middle" fill="#fae8ff" font-size="11">FC layers</text>
  <text x="730" y="122" text-anchor="middle" fill="#fae8ff" font-size="10">softmax</text>

  <path d="M780 95 L810 95" stroke="#4f46e5" stroke-width="2"/>
  <rect x="815" y="65" width="35" height="60" rx="6" fill="#db2777"/>
  <text x="832" y="100" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Out</text>

  <text x="430" y="175" text-anchor="middle" fill="#64748b" font-size="12">Local patterns → hierarchical features → class probabilities</text>
</svg>
