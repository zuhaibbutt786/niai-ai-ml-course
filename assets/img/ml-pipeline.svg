<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4f46e5"/>
    </marker>
  </defs>
  <rect width="920" height="180" fill="#f8fafc"/>
  <!-- boxes -->
  <rect x="10" y="50" width="100" height="60" rx="8" fill="#4f46e5"/>
  <text x="60" y="78" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">1. Data</text>
  <text x="60" y="96" text-anchor="middle" fill="#e0e7ff" font-size="11">Collect</text>

  <rect x="140" y="50" width="110" height="60" rx="8" fill="#6366f1"/>
  <text x="195" y="78" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">2. Prepare</text>
  <text x="195" y="96" text-anchor="middle" fill="#e0e7ff" font-size="11">Clean · Encode</text>

  <rect x="280" y="50" width="110" height="60" rx="8" fill="#7c3aed"/>
  <text x="335" y="78" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">3. Features</text>
  <text x="335" y="96" text-anchor="middle" fill="#ede9fe" font-size="11">Engineer</text>

  <rect x="420" y="50" width="110" height="60" rx="8" fill="#8b5cf6"/>
  <text x="475" y="78" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">4. Train</text>
  <text x="475" y="96" text-anchor="middle" fill="#ede9fe" font-size="11">Fit model</text>

  <rect x="560" y="50" width="110" height="60" rx="8" fill="#a855f7"/>
  <text x="615" y="78" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">5. Evaluate</text>
  <text x="615" y="96" text-anchor="middle" fill="#f3e8ff" font-size="11">Metrics</text>

  <rect x="700" y="50" width="100" height="60" rx="8" fill="#c026d3"/>
  <text x="750" y="78" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">6. Deploy</text>
  <text x="750" y="96" text-anchor="middle" fill="#fae8ff" font-size="11">Serve</text>

  <rect x="830" y="50" width="80" height="60" rx="8" fill="#db2777"/>
  <text x="870" y="78" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">7. Monitor</text>
  <text x="870" y="96" text-anchor="middle" fill="#fce7f3" font-size="11">Retrain</text>

  <!-- arrows -->
  <line x1="110" y1="80" x2="138" y2="80" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="250" y1="80" x2="278" y2="80" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="80" x2="418" y2="80" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="80" x2="558" y2="80" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="80" x2="698" y2="80" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="80" x2="828" y2="80" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="460" y="30" text-anchor="middle" fill="#0f172a" font-size="15" font-weight="700">End-to-End Machine Learning Pipeline</text>
  <text x="460" y="160" text-anchor="middle" fill="#64748b" font-size="12">Data → Prepare → Features → Train → Evaluate → Deploy → Monitor &amp; Retrain</text>
</svg>
